<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080b" />
<title>AI 爽窥 · 现实版 HUD 原型</title>
<style>
:root{
  --cyan:#7df6ff;
  --cyan-soft:rgba(125,246,255,.42);
  --cyan-line:rgba(125,246,255,.22);
  --pink:#ff2d78;
  --ink:#eaf6f9;
  --dim:rgba(234,246,249,.55);
  --panel:rgba(5,11,15,.78);
  --font:"Barlow Condensed","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05080b;color:var(--ink);font-family:var(--font);
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}

/* ---------- 画面 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#05080b}
#cam,#fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:filter .5s ease, transform .6s ease}
#cam{opacity:0;transition:opacity .6s ease, filter .5s ease, transform .6s ease}
#cam.on{opacity:1}
body.scanning #cam,body.scanning #fallback{filter:saturate(.22) contrast(1.22) brightness(.82)}
body.locked #cam,body.locked #fallback{filter:saturate(.12) contrast(1.35) brightness(.7)}
body.result #cam,body.result #fallback{filter:saturate(.3) contrast(1.25) brightness(.55)}

.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 38%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.88) 100%)}
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:repeating-linear-gradient(to bottom,rgba(125,246,255,.09) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen}
body.scanning .scanlines,body.locked .scanlines{opacity:1}
.grid{position:absolute;inset:-10%;pointer-events:none;opacity:0;transition:opacity .5s ease,transform 1.2s ease;
  background-image:
    linear-gradient(to right,rgba(125,246,255,.075) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(125,246,255,.075) 1px,transparent 1px);
  background-size:76px 76px;transform:scale(1.06)}
body.scanning .grid,body.locked .grid{opacity:1;transform:scale(1)}

/* ---------- 顶部状态 ---------- */
.hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px}

.tl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px}
.pilot{font-size:11px;letter-spacing:.28em;color:var(--dim);margin-bottom:6px;text-transform:uppercase}
.bar{width:132px;height:5px;background:rgba(255,255,255,.14);margin-bottom:5px;
  transform:skewX(-14deg);overflow:hidden;border-radius:1px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#9dffd6,#4fe3c1);box-shadow:0 0 10px rgba(79,227,193,.7)}
.bar.focus>i{background:linear-gradient(90deg,#ffd479,#ff9f43);box-shadow:0 0 10px rgba(255,159,67,.7)}

.tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:18px;text-align:right}
.stars{font-size:19px;letter-spacing:3px;color:rgba(255,255,255,.22);text-shadow:0 0 8px rgba(0,0,0,.6)}
.stars .on{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.6)}
.evi{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.evi i{width:12px;height:12px;display:block;border:1px solid var(--pink);opacity:.55;
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:rgba(255,45,120,.18)}

/* ---------- 模式横幅 ---------- */
#modeBanner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translate(-50%,-10px);
  display:flex;align-items:center;gap:9px;padding:6px 14px;border:1px solid var(--cyan-line);
  background:rgba(5,12,16,.62);backdrop-filter:blur(6px);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--cyan);opacity:0;transition:.35s ease;white-space:nowrap}
#modeBanner.show{opacity:1;transform:translate(-50%,0)}
#modeBanner .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}

/* 静帧模式（截图/嵌入用）：关闭过渡动画 */
body.still *,body.still *::before,body.still *::after{transition:none!important}
body.still #lockbox .sweep{animation:none!important;top:62%;opacity:1}

/* ---------- 准星 ---------- */
#reticle{position:absolute;left:50%;top:44%;width:132px;height:132px;margin:-66px 0 0 -66px;
  transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.dot{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px rgba(255,255,255,.9)}
.corner{position:absolute;width:15px;height:15px;border:1.6px solid rgba(255,255,255,.55);
  transition:.25s ease}
.corner.a{top:30px;left:30px;border-right:0;border-bottom:0}
.corner.b{top:30px;right:30px;border-left:0;border-bottom:0}
.corner.c{bottom:30px;left:30px;border-right:0;border-top:0}
.corner.d{bottom:30px;right:30px;border-left:0;border-top:0}
body.scanning .corner,body.locked .corner{opacity:0;transform:scale(.7)}

.ring{position:absolute;inset:0;transform:rotate(-90deg);opacity:0;transition:opacity .25s ease}
body.scanning .ring,body.locked .ring,body.result .ring{opacity:1}
.ring circle{fill:none;stroke-width:2}
.ring .bg{stroke:rgba(255,255,255,.10)}
.ring .fg{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:188.5;
  filter:drop-shadow(0 0 6px var(--cyan))}

/* ---------- 锁定框 ---------- */
#lockbox{position:absolute;left:50%;top:44%;width:min(66vw,320px);height:min(34vw,170px);
  transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  transition:opacity .2s ease,left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1)}
#lockbox.on{opacity:1}
#lockbox .lb{position:absolute;width:22px;height:22px;border:2px solid var(--cyan);
  filter:drop-shadow(0 0 8px var(--cyan-soft))}
#lockbox .lb.tl{top:0;left:0;border-right:0;border-bottom:0}
#lockbox .lb.tr{top:0;right:0;border-left:0;border-bottom:0}
#lockbox .lb.bl{bottom:0;left:0;border-right:0;border-top:0}
#lockbox .lb.br{bottom:0;right:0;border-left:0;border-top:0}
#lockbox .fill{position:absolute;inset:0;background:linear-gradient(180deg,rgba(125,246,255,.10),transparent 55%);
  border:1px solid rgba(125,246,255,.16)}
#lockbox .sweep{position:absolute;left:0;right:0;height:2px;top:0;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 14px var(--cyan);animation:sweep 1.1s linear infinite}
@keyframes sweep{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
#lockbox .tag{position:absolute;left:0;top:-22px;font-size:10px;letter-spacing:.2em;color:var(--cyan);
  text-transform:uppercase;white-space:nowrap;opacity:0;transition:.2s}
#lockbox.on .tag{opacity:1}

/* ---------- 结果卡 ---------- */
#card{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  max-height:60vh;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(9,16,20,.94),rgba(4,8,11,.96));
  border:1px solid rgba(150,225,240,.14);border-top:1px solid rgba(150,225,240,.55);
  backdrop-filter:blur(18px) saturate(1.15);padding:16px 18px 14px;
  transform:translateY(calc(100% + 26px));opacity:0;
  transition:transform .4s cubic-bezier(.2,.9,.2,1),opacity .3s;
  pointer-events:auto;box-shadow:0 24px 70px rgba(0,0,0,.72)}
#card.show{transform:translateY(0);opacity:1}
#card.show ~ .mini,#card.show ~ .hold{opacity:0;pointer-events:none}
.mini,.hold{transition:opacity .3s ease}
#card::before{content:"";position:absolute;left:0;top:-1px;width:52px;height:2px;background:var(--cyan);
  box-shadow:0 0 10px rgba(125,246,255,.55)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.card-k{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.26em;
  color:rgba(125,246,255,.85);text-transform:uppercase}
.card-k::before{content:"";width:5px;height:5px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.card-x{pointer-events:auto;font-size:15px;color:rgba(255,255,255,.32);cursor:pointer;line-height:1;padding:2px 4px}
.card-title{font-size:28px;letter-spacing:.02em;font-weight:600;line-height:1.08;color:#fff;
  text-shadow:0 0 22px rgba(125,246,255,.16)}
.card-sub{font-size:9.5px;color:rgba(255,255,255,.32);letter-spacing:.24em;margin-top:8px;text-transform:uppercase}
.hr{height:1px;margin:13px 0;
  background:linear-gradient(90deg,rgba(150,225,240,.24),rgba(150,225,240,.02) 72%,transparent)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;
  padding:5.5px 0;letter-spacing:.04em}
.row .k{color:rgba(255,255,255,.40)}
.row .v{color:rgba(255,255,255,.94);font-variant-numeric:tabular-nums}
.row .v.mute{color:rgba(255,255,255,.40)}
.row .v.money{color:#bdf3ff;text-shadow:0 0 12px rgba(125,246,255,.25)}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.18em;
  color:rgba(255,255,255,.26);margin-top:11px;text-transform:uppercase}
.foot em{font-style:normal;color:rgba(255,255,255,.34)}

/* 原生相机模式：WebView 透明，相机画面来自底层 PreviewView */
body.native, body.native #stage{background:transparent}
body.native #cam, body.native #fallback, body.native .vignette{display:none}
body.native #lockbox .fill{background:linear-gradient(180deg,rgba(125,246,255,.08),transparent 60%)}

/* 底部合规水印 */
.disclaimer{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  transform:translateX(-50%);font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.38);
  white-space:nowrap;pointer-events:none;transition:opacity .25s}
#card.show ~ .disclaimer{opacity:0}

/* 扫描命中闪光 */
#flash{position:absolute;inset:0;background:#e8fdff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.on{animation:flashOut .32s ease-out}
@keyframes flashOut{0%{opacity:.5}100%{opacity:0}}

/* ---------- 小地图 / 按钮 ---------- */
.mini{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:104px;height:104px;
  opacity:.9}
.mini svg{width:100%;height:100%}
.hold{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:74px;height:74px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.06);backdrop-filter:blur(6px);display:grid;place-content:center;
  gap:2px;color:var(--ink);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  pointer-events:auto;transition:.2s;cursor:pointer}
.hold b{display:block;font-size:15px;letter-spacing:.02em}
body.scanning .hold,body.locked .hold{border-color:var(--cyan);background:rgba(125,246,255,.14);
  box-shadow:0 0 26px rgba(125,246,255,.35)}

/* ---------- 提示 ---------- */
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);
  transform:translate(-50%,10px);font-size:11.5px;letter-spacing:.18em;color:#ffd0dc;
  background:rgba(40,6,16,.75);border:1px solid rgba(255,45,120,.4);padding:7px 14px;opacity:0;
  transition:.3s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(80% 60% at 50% 40%,#0d1a22,#04070a 70%);
  display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding:24px;
  transition:opacity .5s ease,visibility .5s}
#intro.hide{opacity:0;visibility:hidden}
.logo{font-size:13px;letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;opacity:.85}
.title{font-size:clamp(30px,9vw,54px);font-weight:700;letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#fff,#7df6ff 70%,#38b6c9);-webkit-background-clip:text;
  background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(125,246,255,.35))}
.sub{font-size:12.5px;color:rgba(255,255,255,.5);letter-spacing:.16em;max-width:19em;line-height:1.9}
#enter{pointer-events:auto;margin-top:6px;padding:13px 34px;border:1px solid var(--cyan-soft);
  background:rgba(125,246,255,.08);color:var(--cyan);font-family:var(--font);font-size:13px;
  letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:.25s;border-radius:2px}
#enter:hover{background:rgba(125,246,255,.18);box-shadow:0 0 34px rgba(125,246,255,.25)}
.hint{font-size:10.5px;color:rgba(255,255,255,.28);letter-spacing:.12em;line-height:1.9;margin-top:2px}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline autoplay muted></video>
  <canvas id="fallback"></canvas>

  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="grid"></div>
  <div id="flash"></div>

  <div class="hud">
    <div class="tl">
      <div class="pilot">JASON · VICE CITY</div>
      <div class="bar"><i style="width:82%"></i></div>
      <div class="bar focus"><i style="width:56%"></i></div>
    </div>

    <div class="tr">
      <div class="stars"><span class="on">★</span><span class="on">★</span>★★★★</div>
      <div class="evi"><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="modeBanner"><span class="dot"></span>AI 爽窥 · SCAN MODE</div>

    <div id="lockbox">
      <div class="lb tl"></div><div class="lb tr"></div>
      <div class="lb bl"></div><div class="lb br"></div>
      <div class="fill"></div>
      <div class="sweep"></div>
      <div class="tag">TARGET LOCKED · SCANNING</div>
    </div>

    <div id="reticle">
      <div class="corner a"></div><div class="corner b"></div>
      <div class="corner c"></div><div class="corner d"></div>
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="30"></circle>
        <circle class="fg" cx="50" cy="50" r="30"></circle>
      </svg>
      <div class="dot"></div>
    </div>

    <div id="card">
      <div class="card-h">
        <span class="card-k" id="cardKind">VEHICLE · SCANNED</span>
        <span class="card-x" id="cardX">✕</span>
      </div>
      <div class="card-title" id="cardTitle">绝品 卫士</div>
      <div class="card-sub" id="cardSub">SCAN 0421 · 置信度 87%</div>
      <div class="hr"></div>
      <div id="rows"></div>
      <div class="hr"></div>
      <div class="foot">
        <span id="cardFoot">已收录 · 车辆图鉴 018</span>
        <em>AI 生成 · 仅供娱乐</em>
      </div>
    </div>

    <div class="disclaimer">AI 生成 · 仅供娱乐</div>

    <div class="mini">
      <svg viewBox="0 0 104 104">
        <circle cx="52" cy="52" r="50" fill="#08131a" stroke="rgba(125,246,255,.32)" stroke-width="1.4"/>
        <path d="M6 70 L38 56 L52 14" stroke="rgba(255,255,255,.13)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M20 96 L52 56 L96 44" stroke="rgba(255,255,255,.10)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M8 30 L44 40 L90 22" stroke="rgba(125,246,255,.20)" stroke-width="2" fill="none"/>
        <circle cx="52" cy="52" r="16" fill="rgba(125,246,255,.07)"/>
        <polygon points="52,40 60,58 52,54 44,58" fill="#7df6ff"/>
        <circle cx="70" cy="34" r="2.5" fill="#ff2d78"/>
        <circle cx="30" cy="66" r="2" fill="rgba(255,255,255,.5)"/>
      </svg>
    </div>

    <button class="hold" id="holdBtn"><b>HOLD</b>扫描</button>
    <div id="toast">扫描中断</div>
  </div>
</div>

<div id="intro">
  <div class="logo">LEONIDA · AI SCAN</div>
  <div class="title">AI 爽窥</div>
  <div class="sub">长按画面任意处锁定目标并扫描。<br/>对准车辆、地标或街边奇闻点试试。</div>
  <button id="enter">启用相机</button>
  <div class="hint">拒绝授权也能玩 · 自动切换演示背景<br/>桌面端：按住空格或鼠标 / Esc 关闭卡片</div>
</div>

<script>
(function(){
  "use strict";

  var stage    = document.getElementById('stage');
  var video    = document.getElementById('cam');
  var fallback = document.getElementById('fallback');
  var reticle  = document.getElementById('reticle');
  var lockbox  = document.getElementById('lockbox');
  var card     = document.getElementById('card');
  var intro    = document.getElementById('intro');
  var banner   = document.getElementById('modeBanner');
  var toast    = document.getElementById('toast');
  var ringFg   = document.querySelector('.ring .fg');
  var holdBtn  = document.getElementById('holdBtn');

  var RING_LEN = 2 * Math.PI * 30;
  var SCAN_MS  = 1150;
  var HOLD_DELAY = 130;

  // 是否运行在原生壳里（相机、检测、OCR 都在 Java 层）
  var NATIVE = location.search.indexOf('native=1') >= 0;
  var nativeTarget = null;
  var nativeReady = false;
  if (NATIVE){
    document.body.classList.add('native');
    document.documentElement.style.background = 'transparent';
  }

  var pos = { x: 50, y: 44 };   // 百分比
  var mode = 'idle';            // idle | scanning | locked | result
  var holdTimer = null, rafId = 0, startedAt = 0;
  var streak = 0, bag = [];

  /* ---------------- 数据（模拟） ---------------- */
  var CARS = [
    { kind:'VEHICLE · SCANNED', title:'绝品 卫士', sub:'SCAN 0421 · 置信度 87%', value:95000,
      rows:[ ['车身形式','轿车'],['车牌','粤B·D7F21'],['车身颜色','珍珠白'] ] },
    { kind:'VEHICLE · SCANNED', title:'威皮 公路霸者', sub:'SCAN 0422 · 置信度 91%', value:35000,
      rows:[ ['车身形式','跑车'],['车牌','粤B·2K8T9'],['车身颜色','赛道红'] ] },
    { kind:'VEHICLE · SCANNED', title:'悠游 行者', sub:'SCAN 0423 · 置信度 79%', value:90000,
      rows:[ ['车身形式','SUV'],['车牌','粤B·8Q1L4'],['车身颜色','曼岛绿'] ] },
    { kind:'VEHICLE · SCANNED', title:'佩嘉西 泰皮斯达', sub:'SCAN 0424 · 置信度 84%', value:1329000,
      rows:[ ['车身形式','跑车'],['车牌','粤B·5Z7N2'],['车身颜色','竞速黄'] ] }
  ];
  var SPOTS = [
    { kind:'LANDMARK · SCANNED', title:'湾岸灯塔', sub:'LANDMARK · 1978', rows:[
      ['坐标','22.5429, 114.0562'],['开放时间','全天'],['门票','免费'],
      ['历史事件','2026 年翻修'],['内部结构','无法获取'] ] },
    { kind:'ANOMALY · SCANNED', title:'旧港 7 号货仓', sub:'ANOMALY · 03:00', rows:[
      ['坐标','22.5481, 114.0517'],['热度','87 / 100'],['最近目击','3 天前'],
      ['真实性','未验证'] ] },
    { kind:'LANDMARK · SCANNED', title:'霓虹天桥', sub:'LANDMARK · 1986', rows:[
      ['坐标','22.5402, 114.0603'],['开放时间','06:00 – 23:00'],['门票','免费'],
      ['人流峰值','21:00'],['内部结构','无法获取'] ] }
  ];

  function money(n){ return '$' + n.toLocaleString('en-US'); }
  function regFee(v){ return Math.max(100, Math.round(v * 0.01 / 50) * 50); }
  // 越贵的车越可能装高级追踪器（对应游戏里"高级追踪器被盗即报警"的设定）
  function pickTracker(v){
    var r = Math.random(), none, normal;
    if (v < 60000)       { none = 0.62; normal = 0.32; }
    else if (v < 300000) { none = 0.24; normal = 0.54; }
    else                 { none = 0.08; normal = 0.40; }
    if (r < none) return '无追踪器';
    if (r < none + normal) return '普通追踪器';
    return '高级追踪器';
  }

  /* ---------------- 回落背景 ---------------- */
  var ctx = fallback.getContext('2d');
  var blobs = [];
  function sizeFallback(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fallback.width  = Math.floor(fallback.clientWidth  * dpr);
    fallback.height = Math.floor(fallback.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    blobs = [];
    for (var i = 0; i < 16; i++){
      blobs.push({
        x: Math.random(), y: Math.random(),
        r: 40 + Math.random() * 130,
        s: 0.00008 + Math.random() * 0.00016,
        c: ['#0e5c6b','#7a1f45','#1a3f52','#2a5f6e','#5b1f3a'][i % 5],
        a: 0.10 + Math.random() * 0.18
      });
    }
  }
  function drawFallback(t){
    var w = fallback.clientWidth, h = fallback.clientHeight;
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#08131b'); g.addColorStop(0.55, '#0a1116'); g.addColorStop(1, '#04070a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < blobs.length; i++){
      var b = blobs[i];
      b.y -= b.s * 16;
      if (b.y < -0.25) { b.y = 1.25; b.x = Math.random(); }
      var cx = b.x * w, cy = b.y * h;
      var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, b.r);
      rg.addColorStop(0, b.c); rg.addColorStop(1, 'transparent');
      ctx.globalAlpha = b.a; ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cx, cy, b.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    rafBg = requestAnimationFrame(drawFallback);
  }
  var rafBg = 0;

  /* ---------------- 相机 ---------------- */
  function startCamera(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject();
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } },
      audio: false
    }).then(function(stream){
      video.srcObject = stream;
      return video.play().then(function(){ video.classList.add('on'); return true; });
    });
  }

  /* ---------------- 视觉状态 ---------------- */
  function setMode(next){
    mode = next;
    document.body.classList.toggle('scanning', next === 'scanning');
    document.body.classList.toggle('locked',   next === 'locked');
    document.body.classList.toggle('result',   next === 'result');
    banner.classList.toggle('show', next !== 'idle' && next !== 'result');
    var showBox = NATIVE
      ? (!!nativeTarget && next !== 'result')
      : (next === 'scanning' || next === 'locked');
    lockbox.classList.toggle('on', showBox);
  }

  function moveTo(nx, ny){
    pos.x = Math.max(8, Math.min(92, nx));
    pos.y = Math.max(12, Math.min(88, ny));
    reticle.style.left = pos.x + '%';
    reticle.style.top  = pos.y + '%';
    lockbox.style.left = pos.x + '%';
    lockbox.style.top  = pos.y + '%';
  }

  function vibrate(pattern){ if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }

  /* ---------------- 扫描流程 ---------------- */
  function beginScan(){
    if (mode === 'scanning' || mode === 'locked') return;
    if (NATIVE && !nativeTarget) { showToast('未锁定目标'); return; }
    closeCard(true);
    setMode('scanning');
    ringFg.style.strokeDashoffset = RING_LEN;
    startedAt = performance.now();
    vibrate(18);
    sfx('scan');
    rafId = requestAnimationFrame(tick);
  }

  function tick(now){
    var p = Math.min(1, (now - startedAt) / SCAN_MS);
    ringFg.style.strokeDashoffset = RING_LEN * (1 - p);
    if (p >= 0.55 && mode === 'scanning') setMode('locked');
    if (p >= 1) { finishScan(); return; }
    rafId = requestAnimationFrame(tick);
  }

  function cancelScan(interrupted){
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    ringFg.style.strokeDashoffset = RING_LEN;
    if (mode === 'scanning' || mode === 'locked'){
      setMode('idle');
      if (interrupted) { showToast('扫描中断'); sfx('cancel'); }
    }
  }

  function finishScan(){
    rafId = 0;
    ringFg.style.strokeDashoffset = 0;
    var f = document.getElementById('flash');
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    vibrate([24, 40, 70]);

    if (NATIVE){
      // 交回原生层：重新检测 + 车牌 OCR，结果异步回来
      setMode('result');
      sfx('stop');
      try {
        if (window.Android && window.Android.capture) window.Android.capture();
        else onNativeResult({ ok:false, reason:'no_bridge' });
      } catch (e) {
        onNativeResult({ ok:false, reason:'no_bridge' });
      }
      return;
    }

    setMode('result');
    vibrate([24, 40, 70]);
    sfx('done');
    var pool = (streak++ % 3 === 2) ? SPOTS : (Math.random() < 0.22 ? SPOTS : CARS);
    var item = pool[Math.floor(Math.random() * pool.length)];
    renderCard(item);
  }

  /* ---------------- 原生桥 ---------------- */
  function placeLockbox(b){
    var w = window.innerWidth, h = window.innerHeight;
    var l = b.l * w, t = b.t * h, r = b.r * w, bb = b.b * h;
    var cx = (l + r) / 2, cy = (t + bb) / 2;
    lockbox.style.width  = (r - l) + 'px';
    lockbox.style.height = (bb - t) + 'px';
    lockbox.style.left = cx + 'px';
    lockbox.style.top  = cy + 'px';
    reticle.style.left = cx + 'px';
    reticle.style.top  = cy + 'px';
  }

  function onNativeDetect(boxes){
    if (!NATIVE) return;
    var best = null, bestScore = -1;
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (var i = 0; i < boxes.length; i++){
      var b = boxes[i];
      var bx = (b.l + b.r) / 2 * window.innerWidth;
      var by = (b.t + b.b) / 2 * window.innerHeight;
      var dist = Math.hypot(bx - cx, by - cy);
      var score = b.s * 2 - dist / Math.max(window.innerWidth, window.innerHeight);
      if (score > bestScore){ bestScore = score; best = b; }
    }
    var had = !!nativeTarget;
    nativeTarget = best;
    if (best && !had && mode === 'idle') sfx('lock');
    if (best) placeLockbox(best);
    if (mode !== 'scanning' && mode !== 'locked' && mode !== 'result'){
      lockbox.classList.toggle('on', !!best);
    }
  }

  function onNativeResult(res){
    if (!NATIVE) return;
    if (!res || !res.ok){
      setMode('idle');
      ringFg.style.strokeDashoffset = RING_LEN;
      var msg = {
        no_target: '未锁定目标',
        no_frame: '相机未就绪',
        no_permission: '没有相机权限',
        no_bridge: '原生模块未连接'
      }[res && res.reason] || '扫描失败，请靠近目标';
      showToast(msg);
      sfx('cancel');
      return;
    }
    setMode('result');
    vibrate([24, 40, 70]);
    sfx('done');
    renderCard({
      kind: res.kind || 'VEHICLE · SCANNED',
      title: res.title,
      sub: res.sub,
      rows: res.rows,
      raw: true
    });
  }

  window.__native = {
    onReady: function(){ nativeReady = true; },
    onDetect: onNativeDetect,
    onResult: onNativeResult
  };

  function sfx(name){
    try { if (window.Android && window.Android.sfx) window.Android.sfx(name); } catch (e) {}
  }


  function renderCard(item){
    document.getElementById('cardKind').textContent = item.kind;
    document.getElementById('cardTitle').textContent = item.title;
    document.getElementById('cardSub').textContent = item.sub;

    var list = item.rows.slice();
    if (!item.raw && item.kind.indexOf('VEHICLE') === 0){
      if (!item._tracker) item._tracker = pickTracker(item.value);
      list = list.concat([
        ['__hr__', ''],
        ['车辆价值', money(item.value), 'money'],
        ['登记费', money(regFee(item.value))],
        ['防盗系统', item._tracker],
        ['车主信息', '未知']
      ]);
    }

    var rows = document.getElementById('rows');
    rows.innerHTML = '';
    var shown = 0;
    list.forEach(function(r){
      if (r[0] === '__hr__'){
        var hr = document.createElement('div');
        hr.className = 'hr';
        hr.style.margin = '9px 0';
        rows.appendChild(hr);
        return;
      }
      var div = document.createElement('div');
      div.className = 'row';
      div.style.opacity = '0';
      div.style.transition = 'opacity .25s ease ' + (shown * 0.05) + 's';
      var mute = (r[1] === '无法获取' || r[1] === '未知' || r[1] === '未验证');
      var cls = r[2] || (mute ? 'mute' : '');
      div.innerHTML = '<span class="k">' + r[0] + '</span>' +
        '<span class="v' + (cls ? ' ' + cls : '') + '">' + r[1] + '</span>';
      rows.appendChild(div);
      (function(d){ requestAnimationFrame(function(){ d.style.opacity = '1'; }); })(div);
      shown++;
    });

    document.getElementById('cardFoot').textContent =
      item.kind.indexOf('VEHICLE') === 0 ? '已收录 · 车辆图鉴 018' : '已收录 · 地点进度 007';
    card.classList.add('show');
    bag.push(item.title);
    if (bag.length > 30) bag.shift();
  }

  function closeCard(silent){
    if (!card.classList.contains('show')) return;
    card.classList.remove('show');
    if (!silent && mode === 'result') setTimeout(function(){ setMode('idle'); }, 260);
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1200);
  }

  /* ---------------- 手势 ---------------- */
  function stagePoint(e){
    var r = stage.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * 100, y: ((e.clientY - r.top) / r.height) * 100 };
  }

  var pointerDownAt = null, scanArmed = false;

  stage.addEventListener('pointerdown', function(e){
    if (e.target === holdBtn || holdBtn.contains(e.target)) return;
    if (card.contains(e.target)) return;

    if (mode === 'result') { closeCard(); return; }

    var p = stagePoint(e);
    if (!NATIVE) moveTo(p.x, p.y);
    scanArmed = true;
    pointerDownAt = performance.now();
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function(){
      if (scanArmed) beginScan();
    }, HOLD_DELAY);
  });

  window.addEventListener('pointerup', function(){
    scanArmed = false;
    clearTimeout(holdTimer);
    if (mode === 'scanning' || mode === 'locked') cancelScan(true);
  });

  window.addEventListener('pointercancel', function(){
    scanArmed = false;
    clearTimeout(holdTimer);
    cancelScan(true);
  });

  stage.addEventListener('pointermove', function(e){
    if (!scanArmed || mode === 'idle' || NATIVE) return;
    var p = stagePoint(e);
    moveTo(p.x, p.y);
  });

  holdBtn.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    if (mode === 'result') { closeCard(); return; }
    beginScan();
  });
  holdBtn.addEventListener('pointerup', function(e){
    e.preventDefault();
    if (mode === 'scanning' || mode === 'locked') cancelScan(true);
  });

  document.getElementById('cardX').addEventListener('click', function(e){
    e.stopPropagation(); closeCard();
  });

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && mode !== 'result') beginScan(); }
    if (e.code === 'Escape') { closeCard(); cancelScan(false); }
  });
  document.addEventListener('keyup', function(e){
    if (e.code === 'Space' && (mode === 'scanning' || mode === 'locked')) cancelScan(true);
  });

  /* ---------------- 启动 ---------------- */
  document.getElementById('enter').addEventListener('click', function(){
    intro.classList.add('hide');
    startCamera().catch(function(){
      showToast('未获得相机权限 · 使用演示背景');
    });
  });

  sizeFallback();
  window.addEventListener('resize', function(){ sizeFallback(); });
  moveTo(pos.x, pos.y);
  rafBg = requestAnimationFrame(drawFallback);

  // 原生壳里相机由 Java 层负责，跳过开场页
  if (NATIVE){
    intro.style.transition = 'none';
    intro.style.display = 'none';
  }

  // 便于截图/嵌入：?nointro=1&state=scan|result&still=1
  var qs = new URLSearchParams(location.search);
  if (qs.has('still')) document.body.classList.add('still');
  if (qs.has('nointro')){
    intro.style.transition = 'none';
    intro.style.display = 'none';
    var s = qs.get('state');
    if (s === 'scan') setTimeout(beginScan, 350);
    if (s === 'result') setTimeout(function(){
      setMode('result');
      ringFg.style.strokeDashoffset = 0;
      renderCard(CARS[0]);
    }, 150);
  }
})();
</script>
</body>
